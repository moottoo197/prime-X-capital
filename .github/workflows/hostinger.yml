name: Auto-Deploy AI Studio to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-to-hostinger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest AI Studio code
        uses: actions/checkout@v4

      - name: Sync public_html to Hostinger File Manager
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public_html/
          server-dir: /public_html/
          local-dir: ./server/
          server-dir: /server/
